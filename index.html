<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura AI-Assistant</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726c?auto=format&fit=crop&w=1740&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: -1;
        }
        .ai-message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .bg-gray-700 pre {
            background-color: #000000; /* Black background */
            color: #4ade80; /* Green text */
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre;
        }
        .bg-gray-700 pre code {
            font-family: 'Courier New', Courier, monospace;
        }

        .run-html-button {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 6px 12px;
            margin-top: 10px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .run-html-button:hover {
            background-color: #1d4ed8;
        }
        
        /* --- NAYA CSS: Image Preview ke liye --- */
        #imagePreviewContainer {
            display: none; /* Default hidden */
            position: relative;
            padding: 8px;
            background-color: rgba(75, 85, 99, 0.7); /* gray-600 with 70% opacity */
            border: 1px solid #6b7280; /* gray-500 */
            border-radius: 12px;
            margin-bottom: 8px;
            backdrop-filter: blur(2px);
        }
        #imagePreview {
            max-height: 100px;
            width: auto;
            border-radius: 6px;
        }
        #removeImageButton {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #ef4444; /* red-500 */
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            border: 2px solid white;
        }
        /* --- End of new CSS --- */


        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .message-fade-in {
          animation: fadeIn 0.3s ease-out;
        }
        @keyframes bounce {
          0%, 80%, 100% { transform: scale(0); }
          40% { transform: scale(1.0); }
        }
        .typing-dot {
          width: 8px; height: 8px;
          background-color: #9ca3af;
          border-radius: 50%;
          display: inline-block;
          animation: bounce 1.4s infinite ease-in-out both;
        }
        #voiceCommandIndicator {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 200px;
            background-image: url('https://i.gifer.com/ZNeT.gif');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: none;
            z-index: 1000;
        }
        .toggle-label {
            position: relative;
            display: inline-block;
            width: 50px; height: 26px;
        }
        .toggle-label input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #4b5563;
            transition: .4s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(24px); }
        
        #suggestedQuestionsContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
            justify-content: center;
        }
        .suggested-question {
            background-color: rgba(75, 85, 99, 0.7);
            color: #d1d5db;
            border: 1px solid #6b7280;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            animation: fadeIn 0.3s ease-out;
            backdrop-filter: blur(2px);
        }
        .suggested-question:hover {
            background-color: rgba(107, 114, 128, 0.8);
            color: white;
        }
    </style>
</head>
<body class="antialiased">

    <div class="flex flex-col max-w-3xl mx-auto p-4 relative z-0" style="height: 100dvh;">
        
        <header class="py-4 text-center space-y-2">
            <h1 class="text-3xl font-bold text-blue-400" style="text-shadow: 0 0 8px rgba(59, 130, 246, 0.5);">Aura AI-Assistant</h1>
            <p class="text-gray-300">Aura AI-Assistant with Google Search for authentic answers</p>
            <div class="flex items-center justify-center space-x-2 pt-2">
                <span id="creativeModeLabel" class="text-gray-400 font-medium transition-colors duration-300">Aura Mode</span>
                <label class="toggle-label">
                    <input type="checkbox" id="creativeModeToggle">
                    <span class="slider"></span>
                </label>
                <span class="text-blue-400 font-medium transition-colors duration-300">✨ Creative</span>
            </div>
        </header>

        <div id="chatbox" class="flex-1 bg-gray-800 bg-opacity-70 backdrop-filter backdrop-blur-sm rounded-lg shadow-inner p-4 overflow-y-auto space-y-4 mb-4 border border-gray-700">
            <div class="flex flex-col message-fade-in">
                <div class="p-3 rounded-lg bg-gray-700 bg-opacity-90 max-w-lg self-start mr-auto">
                    <p class="ai-message-content">Hello! I am Aura. You can now upload images to ask questions.</p>
                </div>
            </div>
        </div>
        
        <div id="typingIndicator" class="hidden items-center space-x-2 p-3 rounded-lg bg-gray-700 bg-opacity-90 max-w-lg self-start mr-auto mb-4">
            <div class="typing-dot"></div>
            <div class="typing-dot" style="animation-delay: 0.2s;"></div>
            <div class="typing-dot" style="animation-delay: 0.4s;"></div>
        </div>

        <div id="suggestedQuestionsContainer"></div>

        <div id="imagePreviewContainer">
            <img id="imagePreview" src="" alt="Image preview">
            <div id="removeImageButton">X</div>
        </div>
        <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp" class="hidden">

        <footer class="flex items-center space-x-2 relative z-10">
            
            <button
                id="imageUploadButton"
                class="bg-gray-600 text-white p-3 rounded-lg hover:bg-gray-700 transition-colors duration-200 flex-shrink-0"
                title="Upload Image"
            >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-6 h-6">
                  <path fill-rule="evenodd" d="M15.621 4.379a3 3 0 0 0-4.242 0l-7 7a3 3 0 0 0 4.241 4.243L15.5 8.743a1.5 1.5 0 0 1-2.121-2.122L6.95 13.05a.75.75 0 0 0 1.061 1.06l6.42-6.42a.75.75 0 0 0-1.06-1.06L6.95 13.05a.75.75 0 0 0 1.06 1.06l6.42-6.42-.001.001a.75.75 0 0 0-1.06-1.06l-6.42 6.42a2.25 2.25 0 0 0 3.182 3.182l7-7a4.5 4.5 0 0 0-6.364-6.364l-7 7a4.5 4.5 0 0 0 6.364 6.364l.001-.001 7-7a3 3 0 0 0 0-4.243Z" clip-rule="evenodd" />
                </svg>
            </button>
            
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type your message or click the mic..." 
                class="flex-1 p-3 bg-gray-700 bg-opacity-80 backdrop-filter backdrop-blur-sm border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
            <button
                id="suggestButton"
                class="bg-yellow-500 text-white p-3 rounded-lg hover:bg-yellow-600 transition-colors duration-200 disabled:bg-gray-500 disabled:cursor-not-allowed flex-shrink-0"
                title="✨ Suggest Follow-ups"
            >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-6 h-6">
                  <path fill-rule="evenodd" d="M10.868 2.884c-.321-.772-1.415-.772-1.736 0l-1.83 4.401-4.753.39-3.47 3.38.94 4.867 4.223-2.338 4.142 2.662 1.05-4.79 3.493-3.41-4.83-.34-1.832-4.4zM10 12.433l-2.49 1.577.472-2.8-2.074-2.02.29-.02 2.793-.23.9-2.71.9 2.71 2.793.23.29.02-2.073 2.02.472 2.8L10 12.433z" clip-rule="evenodd" />
                </svg>
            </button>
            <button 
                id="micButton" 
                class="bg-purple-600 text-white p-3 rounded-lg hover:bg-purple-700 transition-colors duration-200 disabled:bg-gray-500 disabled:cursor-not-allowed flex-shrink-0"
                title="Start Voice Command"
            >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-6 h-6">
                    <path d="M7 4a3 3 0 016 0v6a3 3 0 11-6 0V4z" />
                    <path fill-rule="evenodd" d="M11.5 14.615A5.002 5.002 0 0110 16a5.002 5.002 0 01-1.5-.385v1.892a.75.75 0 01-1.5 0v-1.892A6.501 6.501 0 003.5 11V8a.75.75 0 011.5 0v3A5 5 0 0110 6a5 5 0 015 5v3a.75.75 0 01-1.5 0V11a6.501 6.501 0 00-5-6.385z" clip-rule="evenodd" />
                </svg>
            </button>
            <button 
                id="sendButton" 
                class="bg-blue-600 text-white font-semibold p-3 rounded-lg hover:bg-blue-700 transition-colors duration-200 disabled:bg-gray-500 disabled:cursor-not-allowed flex-shrink-0"
                title="Send Message"
            >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-6 h-6">
                    <path d="M3.105 3.105a.75.75 0 01.884-.03l14 7a.75.75 0 010 1.348l-14 7a.75.75 0 01-1.072-.994l2.093-6.539a.75.75 0 000-.238L2.01 4.13a.75.75 0 01.094-1.025z" />
                </svg>
            </button>
        </footer>

    </div>

    <div id="voiceCommandIndicator" class="hidden"></div>

    <script type="module">
        // --- DOM Elements ---
        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const micButton = document.getElementById('micButton');
        const suggestButton = document.getElementById('suggestButton');
        const suggestedQuestionsContainer = document.getElementById('suggestedQuestionsContainer');
        const typingIndicator = document.getElementById('typingIndicator');
        const voiceCommandIndicator = document.getElementById('voiceCommandIndicator');
        const creativeModeToggle = document.getElementById('creativeModeToggle');
        const creativeModeLabel = document.getElementById('creativeModeLabel');

        // --- NAYE DOM Elements ---
        const imageUploadButton = document.getElementById('imageUploadButton');
        const fileInput = document.getElementById('fileInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const removeImageButton = document.getElementById('removeImageButton');
        
        const apiKey = "AIzaSyDMJ7gJ_fT5sZ79_kX6vKpcK7nmOwFVkTU"; 
        
        // --- API Endpoint Update ---
        // Hum model ko 'gemini-2.5-flash-preview-09-2025' hi rakhenge, yeh vision capable hai
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        // --- State ---
        let isCreativeMode = false;
        let chatHistory = [
            { 
                role: "model", 
                parts: [{ text: "Hello! I am Aura. You can now upload images to ask questions." }] 
            }
        ];
        // NAYA: Uploaded image data store karne ke liye
        let uploadedImageData = {
            base64Data: null,
            mimeType: null,
            dataUrl: null // Preview ke liye
        };

        const systemPrompt = `
You are Aura, a powerful and precise AI assistant capable of solving complex problems (A to Z).
**Your primary rule is to be direct, concise, and accurate.**
- You are a multimodal AI. You can understand text and images.
- If the user asks for a program or code, provide ONLY the code block.
- If the user asks a general question, provide ONLY the direct answer.
- If the user provides an image, answer their question about that image.
- For factual queries, you MUST use the provided Google Search tool.
        `;

        // --- Speech Recognition setup (No changes here) ---
        let recognition;
        let isListening = false;
        let speechRequestSent = false; 

        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US'; 
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                speechRequestSent = false;
                isListening = true;
                micButton.classList.add('bg-red-500', 'animate-pulse'); 
                micButton.classList.remove('bg-purple-600', 'hover:bg-purple-700');
                voiceCommandIndicator.classList.remove('hidden');
                voiceCommandIndicator.classList.add('flex'); 
                userInput.placeholder = "Listening...";
                userInput.disabled = true;
                sendButton.disabled = true;
                suggestButton.disabled = true;
            };

            recognition.onresult = (event) => {
                speechRequestSent = true; 
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                handleUserRequest(); 
            };

            recognition.onend = () => {
                isListening = false;
                micButton.classList.remove('bg-red-500', 'animate-pulse');
                micButton.classList.add('bg-purple-600', 'hover:bg-purple-700');
                voiceCommandIndicator.classList.add('hidden');
                voiceCommandIndicator.classList.remove('flex'); 

                if (!speechRequestSent) {
                    userInput.placeholder = "Type your message or click the mic...";
                    userInput.disabled = false;
                    sendButton.disabled = false;
                    suggestButton.disabled = false;
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                    console.warn("Speech recognition: No speech detected.");
                } else if (event.error === 'not-allowed') {
                    console.error("Speech recognition error: Microphone access denied.");
                    displayMessage("Voice command error: Microphone access was denied.", 'ai-error');
                } else {
                    console.error("Speech recognition error:", event.error);
                    displayMessage(`Voice command error: ${event.error}`, 'ai-error');
                }
            };

            micButton.addEventListener('click', () => {
                if (isListening) {
                    recognition.stop(); 
                } else {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error("Error starting speech recognition:", e);
                        displayMessage("Could not start voice command.", 'ai-error');
                        if (recognition) recognition.abort();
                        isListening = false;
                        micButton.classList.remove('bg-red-500', 'animate-pulse');
                        micButton.classList.add('bg-purple-600', 'hover:bg-purple-700');
                        voiceCommandIndicator.classList.add('hidden');
                        voiceCommandIndicator.classList.remove('flex');
                        userInput.placeholder = "Type your message or click the mic...";
                        userInput.disabled = false;
                        sendButton.disabled = false;
                        suggestButton.disabled = false;
                    }
                }
            });
        } else {
            micButton.disabled = true;
            micButton.title = "Voice command not supported by your browser";
        }

        // --- Event Listeners ---
        sendButton.addEventListener('click', handleUserRequest);
        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); 
                handleUserRequest();
            }
        });

        creativeModeToggle.addEventListener('change', () => {
            isCreativeMode = creativeModeToggle.checked;
            // ... (rest of the logic is same)
        });

        suggestButton.addEventListener('click', generateFollowUps);

        suggestedQuestionsContainer.addEventListener('click', (event) => {
            // ... (rest of the logic is same)
        });
        
        chatbox.addEventListener('click', (event) => {
            if (event.target && event.target.classList.contains('run-html-button')) {
                const htmlContent = event.target.dataset.html;
                runHtmlInNewTab(htmlContent);
            }
        });

        // --- NAYE Event Listeners (Image Upload) ---
        imageUploadButton.addEventListener('click', () => {
            fileInput.click(); // Hidden input ko click karo
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                if (file.size > 4 * 1024 * 1024) { // 4MB Limit
                    displayMessage("Error: Image size must be less than 4MB.", 'ai-error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    // Base64 data nikalna
                    const base64Data = dataUrl.split(',')[1]; 
                    
                    uploadedImageData = {
                        base64Data: base64Data,
                        mimeType: file.type,
                        dataUrl: dataUrl // Preview ke liye
                    };
                    
                    imagePreview.src = dataUrl;
                    imagePreviewContainer.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
            // Reset file input to allow uploading the same file again
            fileInput.value = null; 
        });

        removeImageButton.addEventListener('click', () => {
            clearImagePreview();
        });

        function clearImagePreview() {
            uploadedImageData = { base64Data: null, mimeType: null, dataUrl: null };
            imagePreview.src = '';
            imagePreviewContainer.style.display = 'none';
        }
        
        /**
         * Main function - UPDATE KIYA GAYA HAI
         */
        async function handleUserRequest() {
            const prompt = userInput.value.trim();
            
            // User ko message bhej-ne ke liye text ya image, dono mein se ek zaroori hai
            if (!prompt && !uploadedImageData.base64Data) return;

            // NAYA: Chat history parts tayyar karo
            const userParts = [];
            if (prompt) {
                userParts.push({ text: prompt });
            }
            if (uploadedImageData.base64Data) {
                userParts.push({
                    inlineData: {
                        mimeType: uploadedImageData.mimeType,
                        data: uploadedImageData.base64Data
                    }
                });
            }

            // User message ko chat mein display karo (image ke saath)
            displayMessage(prompt, 'user', uploadedImageData.dataUrl);
            
            // Chat history mein add karo
            chatHistory.push({ role: "user", parts: userParts });
            
            // Input aur preview ko clear karo
            userInput.value = '';
            clearImagePreview();
            
            // UI Disable karo
            userInput.disabled = true;
            sendButton.disabled = true;
            micButton.disabled = true; 
            suggestButton.disabled = true;
            imageUploadButton.disabled = true; // Upload button bhi disable karo
            
            clearSuggestedQuestions();
            
            typingIndicator.classList.remove('hidden');
            typingIndicator.classList.add('flex');
            chatbox.scrollTop = chatbox.scrollHeight;

            try {
                // API Call (ab yeh multimodal history bhejega)
                const { text, sources } = await callGeminiApi();
                
                chatHistory.push({ role: "model", parts: [{ text: text }] });
                displayMessage(text, 'ai');

                if (sources && sources.length > 0) {
                    displaySources(sources);
                }

            } catch (error) {
                console.error('Error calling Gemini API:', error);
                displayMessage(`Sorry, I ran into an error: ${error.message}`, 'ai-error');
                chatHistory.pop(); // Failed message history se hata do
            } finally {
                // UI ko wapas enable karo
                userInput.disabled = false;
                sendButton.disabled = false;
                micButton.disabled = false; 
                suggestButton.disabled = false;
                imageUploadButton.disabled = false; // Upload button enable karo
                typingIndicator.classList.add('hidden');
                typingIndicator.classList.remove('flex');
                userInput.focus();
            }
        }

        /**
         * Calls the Gemini API (No changes needed here)
         * Yeh 'chatHistory' variable ko use karta hai, jo ab image data bhi support karta hai.
         */
        async function callGeminiApi() {
            const payload = { contents: chatHistory };
            
            // Creative mode ka prompt update kar diya hai
            if (isCreativeMode) {
                payload.systemInstruction = {
                    parts: [{ text: `
You are Aura in Creative Mode. You are a highly capable and imaginative AI.
- You can solve complex creative and technical problems.
- You can understand images and text.
- **If the user asks for a program or code, provide ONLY the code block.**
- For other questions, respond creatively and engagingly, but stay on topic.` 
                    }]
                };
            } else {
                payload.tools = [{ "google_search": {} }];
                payload.systemInstruction = {
                    parts: [{ "text": systemPrompt }]
                };
            }
            
            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            };
            
            const response = await fetchWithBackoff(apiUrl, options);
            if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`API request failed with status ${response.status}: ${errorBody}`);
            }
            const result = await response.json();
            const candidate = result.candidates?.[0];
            if (!candidate) {
                if (result.promptFeedback?.blockReason) {
                    throw new Error(`Request was blocked: ${result.promptFeedback.blockReason}`);
                }
                throw new Error('Invalid API response: No candidate returned.');
            }
            if (!candidate.content?.parts?.[0]?.text) {
                if (candidate.finishReason && candidate.finishReason !== "STOP") {
                    throw new Error(`Generation stopped: ${candidate.finishReason}`);
                }
                throw new Error('Invalid API response structure: No text part found.');
            }
            const text = candidate.content.parts[0].text;
            let sources = [];
            // ... (rest of the logic is same)
            return { text, sources };
        }

        async function fetchWithBackoff(url, options, retries = 5, delay = 1000) {
            // ... (function logic is same, no changes)
            try {
                const response = await fetch(url, options);
                if (!response.ok && (response.status === 429 || response.status >= 500)) {
                    throw new Error(`Retryable error: ${response.status}`);
                }
                return response; 
            } catch (error) {
                if (retries > 0) {
                    await new Promise(res => setTimeout(res, delay));
                    return fetchWithBackoff(url, options, retries - 1, delay * 2);
                } else {
                    throw error;
                }
            }
        }

        function runHtmlInNewTab(htmlContent) {
            // ... (function logic is same, no changes)
            const newTab = window.open();
            if (newTab) {
                newTab.document.open();
                newTab.document.write(htmlContent);
                newTab.document.close();
            } else {
                displayMessage("Could not open new tab. Please allow popups for this site.", 'ai-error');
            }
        }

        /**
         * --- displayMessage FUNCTION UPDATE HO GAYA HAI ---
         * Ab yeh user ki uploaded image ko bhi dikha sakta hai.
         */
        function displayMessage(message, sender, imageDataUrl = null) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('p-3', 'rounded-lg', 'max-w-lg', 'break-words', 'shadow-md');

            if (sender === 'user') {
                messageDiv.classList.add('bg-blue-600', 'text-white', 'self-end', 'ml-auto');
                
                // NAYA: Agar user ne image bheji hai, toh usey dikhao
                if (imageDataUrl) {
                    const img = document.createElement('img');
                    img.src = imageDataUrl;
                    img.classList.add('rounded-lg', 'mb-2', 'max-w-full');
                    messageDiv.appendChild(img);
                }
                if (message) {
                    const p = document.createElement('p');
                    p.textContent = message;
                    messageDiv.appendChild(p);
                }

            } else {
                // AI messages (code block logic same hai)
                messageDiv.classList.add('self-start', 'mr-auto');
                
                if (sender === 'ai-error') {
                    messageDiv.classList.add('bg-red-700', 'text-white');
                } else {
                    messageDiv.classList.add('bg-gray-700', 'text-white', 'bg-opacity-90');
                }
                
                const codeBlockRegex = /^```([\w-+]*)\n([\s\S]+?)```$/;
                const match = message.match(codeBlockRegex);
                
                let lang = '';
                let code = '';
                let isHtml = false;

                if (match) {
                    lang = match[1].toLowerCase();
                    code = match[2];
                    if (lang === 'html') isHtml = true;
                } else if (message.trim().startsWith('<!DOCTYPE html>') || message.trim().startsWith('<html')) {
                    lang = 'html';
                    code = message;
                    isHtml = true;
                } else if (message.trim().startsWith('<') && message.trim().endsWith('>')) {
                    lang = 'c';
                    code = message;
                    isHtml = false;
                }

                if (code) {
                    const pre = document.createElement('pre');
                    const codeEl = document.createElement('code');
                    if (lang) codeEl.classList.add(`language-${lang}`);
                    codeEl.textContent = code;
                    pre.appendChild(codeEl);
                    messageDiv.appendChild(pre);
                    
                    if (isHtml) {
                        const runButton = document.createElement('button');
                        runButton.textContent = '▶️ Run HTML Output';
                        runButton.classList.add('run-html-button');
                        runButton.dataset.html = code; 
                        messageDiv.appendChild(runButton);
                    }
                } else {
                    const contentP = document.createElement('p');
                    contentP.classList.add('ai-message-content');
                    contentP.textContent = message;
                    messageDiv.appendChild(contentP);
                }
            }
            
            const messageWrapper = document.createElement('div');
            messageWrapper.classList.add('flex', 'flex-col', 'message-fade-in');
            messageWrapper.appendChild(messageDiv);
            
            chatbox.appendChild(messageWrapper);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function displaySources(sources) {
            // ... (function logic is same, no changes)
            const sourcesContainer = document.createElement('div');
            sourcesContainer.classList.add('p-3', 'rounded-lg', 'bg-gray-700', 'bg-opacity-90', 'max-w-lg', 'text-sm', 'self-start', 'mr-auto', 'border', 'border-gray-600');
            const title = document.createElement('h4');
            title.textContent = 'Sources:';
            title.classList.add('font-semibold', 'mb-2', 'text-gray-300');
            sourcesContainer.appendChild(title);
            const list = document.createElement('ul');
            list.classList.add('list-disc', 'list-inside', 'space-y-1');
            sources.forEach(source => {
                const listItem = document.createElement('li');
                const link = document.createElement('a');
                link.href = source.uri;
                link.textContent = source.title;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.classList.add('text-blue-400', 'hover:underline');
                listItem.appendChild(link);
                list.appendChild(listItem);
            });
            sourcesContainer.appendChild(list);
            const messageWrapper = document.createElement('div');
            messageWrapper.classList.add('flex', 'flex-col', 'message-fade-in');
            messageWrapper.appendChild(sourcesContainer);
            chatbox.appendChild(messageWrapper);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        // --- Suggestion Functions (No changes here) ---

        async function generateFollowUps() {
            // ... (function logic is same, no changes)
            if (chatHistory.length < 2) return; 
            suggestButton.disabled = true;
            suggestButton.classList.add('animate-pulse');
            clearSuggestedQuestions();
            const suggestionPrompt = `
Based on the last user message and AI response, suggest three concise and relevant follow-up questions the user might want to ask next.
Respond ONLY with a valid JSON array of strings.
Example: ["What's the weather like?", "Tell me more about that.", "How does that work?"]`;
            const suggestionContext = [
                ...chatHistory.slice(-2), 
                { role: "user", parts: [{ text: suggestionPrompt }] }
            ];
            try {
                const questions = await callGeminiForSuggestions(suggestionContext);
                if (questions && questions.length > 0) {
                    displaySuggestedQuestions(questions);
                }
            } catch (error) {
                console.error("Error generating suggestions:", error);
            } finally {
                suggestButton.disabled = false;
                suggestButton.classList.remove('animate-pulse');
            }
        }

        async function callGeminiForSuggestions(historyForSuggestion) {
            // ... (function logic is same, no changes)
            const payload = {
                contents: historyForSuggestion,
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "ARRAY",
                        items: { type: "STRING" }
                    }
                }
            };
            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            };
            const response = await fetchWithBackoff(apiUrl, options);
            if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`API request failed with status ${response.status}: ${errorBody}`);
            }
            const result = await response.json();
            const candidate = result.candidates?.[0];
            if (!candidate?.content?.parts?.[0]?.text) {
                throw new Error('Invalid suggestions response structure.');
            }
            return JSON.parse(candidate.content.parts[0].text);
        }

        function displaySuggestedQuestions(questions) {
            // ... (function logic is same, no changes)
            clearSuggestedQuestions();
            questions.slice(0, 3).forEach(question => {
                const button = document.createElement('button');
                button.textContent = question;
                button.classList.add('suggested-question');
                suggestedQuestionsContainer.appendChild(button);
            });
        }

        function clearSuggestedQuestions() {
            suggestedQuestionsContainer.innerHTML = '';
        }

    </script>
